http {
  include mime.types; # map content-type from file extension
  default_type application/octet-stream; # fallback

  sendfile on; # optimize serving static files
  server {
    listen 80;
 
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri; # redirect http traffic to https
    }
  }

  server {
    listen 443 ssl;
    # server_name my_server; # NOTE: use if we have multiple server blocks

    ssl_certificate /etc/letsencrypt/live/squish.humphrey.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/squish.humphrey.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Serve static files from nginx
    location /static/ {
      alias /etc/nginx/static/;
      # expires 30d;
      # add_header Cache-Control "public, immutable"
    }

    # Exact match: for landing page
    location = / {
      root /etc/nginx/static;
      try_files /index.html =404;
    }

    # Pass everything else to backend
    location / {
      proxy_pass http://app:8080; # domain name and port of backend server (hostname defined in docker compose)
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr; # ip addr of client
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # proxy_set_header Upgrade $http_upgrade;  # Websockets
      # proxy_set_header Connection "upgrade"; # Websockets
    }
  }
}

events {} # defaults
