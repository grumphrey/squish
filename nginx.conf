worker_processes auto; # 1 worker per cpu core is usually optimal (default setting is 1)

events {
  worker_connections 1024; # default is 512
  multi_accept on;
}

http {
  include mime.types; # map content-type from file extension
  default_type application/octet-stream; # fallback

  sendfile on; # optimize serving static files
  charset utf-8;
  server_tokens off; # hide nginx version for security

  server {
    listen 80;

    # Serve static files from nginx (css, js, images etc.)
    location /assets/ {
      alias /usr/share/nginx/html/assets/;
      try_files $uri =404;
      expires 30d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # Exact match: for landing page
    # Serve React app from nginx
    location = / {
      root /usr/share/nginx/html;
      try_files /index.html =404;
    }

    # Pass everything else to backend
    location / {
      proxy_pass http://backend:8080; # hostname defined in docker compose, using HTTP internally in private network
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr; # ip addr of client
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id; # for logging
      # proxy_set_header Upgrade $http_upgrade;  # Websockets
      # proxy_set_header Connection "upgrade"; # Websockets
      proxy_intercept_errors on;
      error_page 404 /index.html; # when backend returns 404, nginx intercepts and returns index.html
    }

    # Ensures correct index.html returned by nginx when intercepting 404
    location = /index.html {
      root /usr/share/nginx/html;
      internal; # only allow internal redirects to reach here
    }

    gzip on;
    gzip_min_length 1000; # only compress if > 1000B
    gzip_proxied any;
    gzip_comp_level 6; # TODO: read more
    gzip_types
      text/plain
      text/css
      text/javascript
      application/javascript
      application/json
      application/xml
      image/svg+xml;

    gzip_vary on;

    # limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s; # not necessary to rate limit unless sensitive endpoints? see tradeoffs

    # no need to block hidden files since only static/ mounted in docker
  }
}
