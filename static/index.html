<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>squi.sh - URL shortener</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/script.js" defer></script>
  </head>
  <body>
    <!-- NAV -->
    <nav class="nav">
      <a href="/" class="nav-logo">squi<span>.</span>sh</a>
      <!-- TODO: authentication? -->
      <!-- <div class="nav-ctas"> -->
      <!--   <button class="btn-primary">Log in</button> -->
      <!-- </div> -->
    </nav>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-badge">
        <i class="ti ti-circle-check"></i>
        Free to use!
      </div>
      <h1>
        URL shortener<br />
        <span id="tw" class="highlight"></span><span class="cursor"></span>
      </h1>
      <div class="hero-sub-container">
        <p class="hero-sub">Create short links for your convenience.</p>
        <p class="hero-sub">Simple, no fuss.</p>
      </div>
      <div class="hero-input-row">
        <input
          id="urlInput"
          type="text"
          placeholder="Paste your long URL here…"
        />
        <button onclick="shortenLink()">Shorten link</button>
      </div>
      <div class="hint"></div>
      <div id="shortResult" class="short-result">
        <i class="ti ti-paperclip"></i>
        <span id="shortUrl"></span>
        <button class="copy-btn" onclick="copyLink()">
          <i class="ti ti-copy"></i> Copy
        </button>
      </div>
    </section>

    <!-- FOOTER -->
    <footer>
      <a href="/" class="footer-logo">squi<span>.</span>sh</a>
      <div class="footer-middle">
        <i class="ti ti-alert-circle"></i>
        this project was developed for learning purposes! use at your own risk.
        © 2026
      </div>
      <div class="footer-right">
        built by
        <a
          href="https://www.github.com/grumphrey"
          target="_blank"
          class="footer-link"
          ><i class="ti ti-brand-github"></i>humphrey</a
        >
      </div>
    </footer>
  </body>
</html>
