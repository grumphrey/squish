services:
  certbot: # set up HTTPS with letsencrypt and certbot + renew cert with cron TODO
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx
    restart: no

  nginx:
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt # shared volume between nginx and certbot services
      - ./certbot/www:/var/www/certbot
      - ./certs:/etc/letsencrypt/live/squish.humphrey.app # NOTE: only used for local dev
    environment:
      - TZ=Asia/Singapore
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev # TODO
      # target: prod
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      - ./data/geoip:/var/lib/geoip:ro # data dependencies (i.e. geoip database)
      - ./backend:/app # TODO: for dev (mount source code to container for air to view changes)
      - /app/tmp # TODO: for dev (create anonymous volume to isolate air build output)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} # docker will read from .env
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
       - "5432:5432" # expose to connect dbeaver
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql # init tables
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # shm_size: 256mb

volumes:
  pgdata:
  redis_data:
