services:
  certbot: # set up HTTPS with letsencrypt and certbot + renew cert with cron TODO
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx
    restart: no

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/etc/nginx/static:ro # mount static files
      - ./certbot/conf:/etc/letsencrypt # shared volume between nginx and certbot services
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    expose:
      - "8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB} # docker will read from .env
      - REDIS_ADDRESS=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./data/geoip:/var/lib/geoip:ro # data dependencies (i.e. geoip database)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://app:8080/health"] # TODO: endpoint currently unused
    #   interval: 5s
    #   retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} # docker will read from .env
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
       - "5432:5432" # expose to connect dbeaver
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql # init tables
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # shm_size: 256mb

volumes:
  pgdata:
  redis_data:
