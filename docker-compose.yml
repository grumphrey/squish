services:
  certbot: # set up HTTPS with letsencrypt and certbot + renew cert with cron TODO
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx
    restart: no

  nginx:
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt # shared volume between nginx and certbot services
      - ./certbot/www:/var/www/certbot
      - ./certs:/etc/letsencrypt/live/squish.humphrey.app # NOTE: only used for local dev
    environment:
      - TZ=Asia/Singapore
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev # TODO
      # target: prod
    expose:
      - "8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB} # docker will read from .env
      - REDIS_ADDRESS=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID} # TODO: maybe better way to read env variables instead of listing them all
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_OAUTH_REDIRECT_URL=${GOOGLE_OAUTH_REDIRECT_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_OAUTH_REDIRECT_URL=${GITHUB_OAUTH_REDIRECT_URL}
    volumes:
      - ./data/geoip:/var/lib/geoip:ro # data dependencies (i.e. geoip database)
      - ./backend:/app # TODO: for dev (mount source code to container for air to view changes)
      - /app/tmp # TODO: for dev (create anonymous volume to isolate air build output)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://backend:8080/health"] # TODO: endpoint currently unused
    #   interval: 5s
    #   retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} # docker will read from .env
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
       - "5432:5432" # expose to connect dbeaver
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql # init tables
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # shm_size: 256mb

volumes:
  pgdata:
  redis_data:
